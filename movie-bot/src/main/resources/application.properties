spring.application.name=movie-bot
spring.profiles.active=local

# Ollama API 설정
ollama.api.url=http://localhost:11434/api/generate
ollama.model=llama3.2

# Ollama Embedding API 설정
ollama.embedding.url=http://localhost:11434/api/embeddings
ollama.embedding.model=nomic-embed-text

# TMDB API 설정
tmdb.api.url=https://api.themoviedb.org/3

# PostgreSQL 데이터베이스 연결 설정
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=moviebot
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver